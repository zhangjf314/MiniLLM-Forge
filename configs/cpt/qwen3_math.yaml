stage:
  name: GPU-2A
  baseline_commit: 3b5fa0be15ec17b05af2f5b768cb55780767ebe0
  hypotheses:
    H-CPT-1: Math CPT lowers NLL/PPL on the frozen math validation corpus.
    H-CPT-2: Math CPT may cause measurable degradation on frozen general-domain text.
    H-CPT-3: Domain gain and general degradation are reported as a trade-off.

experiment:
  id: E04
  phase: cpt
  hypothesis: FineMath CPT lowers math validation PPL without hiding general-domain loss.

model:
  name_or_path: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd

data:
  dataset: HuggingFaceTB/finemath
  subset: finemath-4plus
  revision: e92b25a616738fe95dc186b64dfb19f9c8525594
  split: train
  text_field: text
  sampling_rule: pinned streaming order; first accepted range for math validation, subsequent accepted range for CPT
  sequence_length: 512
  training_tokens: 10002432
  math_validation_tokens: 65536
  general_validation_tokens: 65536
  general_source: data/processed/minillm-formal/validation.txt
  controlled_math_source: data/eval/controlled_math.jsonl
  processed_dir: data/processed/qwen-gpu2a
  train_manifest: artifacts/data_manifests/qwen_math_cpt_train.json
  math_validation_manifest: artifacts/data_manifests/qwen_math_validation.json
  general_validation_manifest: artifacts/data_manifests/qwen_general_validation.json
  contamination_report: artifacts/data_manifests/qwen_cpt_contamination_report.json
  ngram_size: 8
  near_threshold: 0.8

optimizer:
  name: AdamW
  lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  foreach: false

scheduler:
  warmup_ratio: 0.03
  min_lr_ratio: 0.1

training:
  formal_steps: 2442
  formal_tokens: 10002432
  qualification_steps: 123
  qualification_tokens: 503808
  calibration_steps: 8
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  effective_tokens_per_update: 4096
  grad_clip: 1.0
  precision: bf16
  gradient_checkpointing: true
  empty_cache_after_step: true
  log_every: 5
  output_dir: runs/E04-qwen3-math-cpt
  seed: 42
  device: cuda

evaluation:
  milestone_steps: [611, 1221, 1832, 2442]
  general_loss_relative_stop_threshold: 0.05
  sustained_evaluations: 2
  math_ppl_plateau_relative_threshold: 0.005
