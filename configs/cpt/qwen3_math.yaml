experiment:
  id: E04-qwen3-math-cpt
  phase: cpt
  hypothesis: FineMath CPT lowers math validation PPL without unacceptable general PPL loss.

model:
  name_or_path: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd

data:
  dataset: HuggingFaceTB/finemath
  subset: finemath-4plus
  revision: e92b25a616738fe95dc186b64dfb19f9c8525594
  split: train
  text_field: text
  max_samples: 20000
  sequence_length: 1024
  validation_fraction: 0.02
  manifest: artifacts/data_manifests/E04_qwen3_math_cpt.json

optimizer: {lr: 1.0e-5, betas: [0.9, 0.95], weight_decay: 0.1}
scheduler: {warmup_ratio: 0.03, min_lr_ratio: 0.1}
training:
  max_steps: 2500
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  grad_clip: 1.0
  precision: bf16
  gradient_checkpointing: true
  log_every: 10
  eval_every: 100
  save_every: 250
  output_dir: runs/E04-qwen3-math-cpt
  seed: 42
