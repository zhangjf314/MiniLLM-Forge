design:
  id: QLORA_CONFIG_V1
  stage: STAGE_GPU_2B_D
  execution_status: frozen_not_run
  paired_initializations:
    BASE_INIT:
      name_or_path: Qwen/Qwen3-0.6B-Base
      revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
    CPT_INIT:
      name_or_path: runs/E04-qwen3-math-cpt/final_model
      result: artifacts/training/qwen_math_cpt_result.json
model:
  method: qlora
  backbone_trainable: false
quantization:
  bits: 4
  quantization_type: nf4
  compute_dtype: bfloat16
  double_quantization: true
  package: bitsandbytes
  package_version: 0.50.2
lora:
  target_modules: all-linear
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  modules_to_save: []
data:
  train_file: data/processed/gpu2b/sft_math_v1_train.jsonl
  validation_file: data/processed/gpu2b/sft_math_v1_validation.jsonl
  manifest: artifacts/data_manifests/sft-dataset-manifest.json
  problem_field: problem
  answer_field: solution
  system_prompt: You are a mathematical reasoning assistant.
  max_length: 1024
  loss_mask: assistant_only
  train_examples: 19200
  validation_examples: 800
  target_token_budget: 7024493
optimizer:
  name: PagedAdamW8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01
  eps: 1.0e-8
scheduler:
  name: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
training:
  epochs: 1
  max_steps: 1200
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  effective_examples_per_update: 16
  grad_clip: 1.0
  precision: bf16
  gradient_checkpointing: true
  checkpoint_selection: FINAL_TOKEN_BUDGET_CHECKPOINT
  early_stopping: false
  seeds: [42, 31415, 271828]
  device: cuda
