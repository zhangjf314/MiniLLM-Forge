experiment:
  id: E02-minillm-no-rope
  phase: pretrain
  hypothesis: Removing RoPE will worsen validation loss at longer positions.

model:
  vocab_size: 24000
  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 1536
  max_seq_len: 1024
  use_rope: false
  tie_word_embeddings: true
  gradient_checkpointing: true
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

data:
  synthetic: false
  files: [data/processed/fineweb_edu_train.txt]
  tokenizer: artifacts/tokenizers/minillm-tokenizer.json
  sequence_length: 1024
  validation_fraction: 0.02

optimizer: {lr: 3.0e-4, betas: [0.9, 0.95], weight_decay: 0.1}
scheduler: {warmup_ratio: 0.03, min_lr_ratio: 0.1}
training:
  max_steps: 12000
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  grad_clip: 1.0
  precision: bf16
  log_every: 10
  eval_every: 250
  save_every: 500
  output_dir: runs/E02-minillm-no-rope
  seed: 42

