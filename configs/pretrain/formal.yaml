experiment:
  id: E01
  phase: pretrain
  hypothesis: A 37M-parameter GQA model learns a limited educational corpus stably.

model:
  vocab_size: 24000
  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 1536
  max_seq_len: 1024
  use_rope: true
  tie_word_embeddings: true
  gradient_checkpointing: true
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

data:
  frozen: true
  synthetic: false
  train_tokens: data/processed/minillm-formal/train.bin
  validation_tokens: data/processed/minillm-formal/validation.bin
  source_dataset: HuggingFaceFW/fineweb-edu
  revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
  manifest: artifacts/data_manifests/minillm_pretrain_formal.json
  tokenizer: artifacts/tokenizers/minillm-tokenizer.json
  sequence_length: 1024
  drop_remainder: true

optimizer:
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1

scheduler:
  warmup_ratio: 0.03
  min_lr_ratio: 0.1

training:
  max_steps: 3052
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  grad_clip: 1.0
  precision: bf16
  log_every: 25
  eval_every: 153
  save_every: 0
  output_dir: runs/E01-minillm-formal
  seed: 42
  device: cuda

checkpoint_steps: [100, 1526]
