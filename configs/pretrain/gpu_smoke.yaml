experiment:
  id: G03-minillm-gpu-smoke-512
  phase: pretrain
  hypothesis: The default 37M MiniLLM can complete bounded BF16 training on an 8GB GPU.

model:
  vocab_size: 24000
  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 1536
  max_seq_len: 1024
  use_rope: true
  tie_word_embeddings: true
  gradient_checkpointing: true
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

data:
  synthetic: true
  samples: 8
  sequence_length: 512
  validation_fraction: 0.25

optimizer: {lr: 3.0e-4, betas: [0.9, 0.95], weight_decay: 0.1}
scheduler: {warmup_steps: 1, min_lr_ratio: 0.1}
training:
  max_steps: 4
  micro_batch_size: 1
  gradient_accumulation_steps: 2
  grad_clip: 1.0
  precision: bf16
  log_every: 1
  eval_every: 2
  save_every: 2
  output_dir: runs/gpu-qualification/minillm-512
  seed: 42
  device: cuda

